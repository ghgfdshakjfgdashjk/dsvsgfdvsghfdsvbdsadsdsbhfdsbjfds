[package]
name = "boots_autoclicker"
version = "0.1.0"
description = "A very fast Windows autoclicker"
authors = ["boots"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "boots_autoclicker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Names the executable itself. Without this the binary inherits the package
# name and you'd get boots_autoclicker.exe regardless of the product name.
[[bin]]
name = "BootsAutoClicker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Updating means downloading an installer and restarting into it, so both.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

